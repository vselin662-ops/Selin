<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Selin Genius - Neural HUD</title>
    <!-- Tailwind CSS 4 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #010204; }
        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'JetBrains Mono', monospace; 
            overflow: hidden;
            margin: 0;
        }
        .font-display { font-family: 'Orbitron', sans-serif; }
        
        /* Эффект шума */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.04; pointer-events: none; z-index: 999;
        }

        /* Анимация вращения кольца */
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .logo-ring { border: 1px dashed rgba(0,242,255,0.4); animation: spin-slow 12s linear infinite; }

        .hud-border { border: 1px solid rgba(0,242,255,0.15); position: relative; }
        .hud-border::before {
            content: ''; position: absolute; top: -1px; left: -1px; width: 8px; height: 8px;
            border-top: 2px solid var(--neon); border-left: 2px solid var(--neon);
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            2% { transform: translate(-2px, 1px); }
            4% { transform: translate(2px, -1px); opacity: 0.8; }
            6% { transform: translate(0); }
        }
        .glitch { animation: glitch 3s infinite; }

        /* Сканирующая полоса */
        .scanline {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.1) 50%), 
                        linear-gradient(90deg, rgba(255,0,0,0.02), rgba(0,255,0,0.01), rgba(0,0,255,0.02));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none; z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <div class="scanline"></div>

    <!-- Зависимости -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [gas, setGas] = useState(14);
            const [time, setTime] = useState(new Date().toLocaleTimeString());

            useEffect(() => {
                const interval = setInterval(() => {
                    setGas(prev => Math.max(8, Math.min(40, prev + (Math.random() * 4 - 2))));
                    setTime(new Date().toLocaleTimeString());
                    if (window.lucide) lucide.createIcons();
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="min-h-screen p-5 flex flex-col relative overflow-y-auto max-w-md mx-auto">
                    
                    {/* Статус-бар */}
                    <div className="flex justify-between items-center mb-6 text-[9px] tracking-widest text-cyan-500/50 font-bold uppercase">
                        <div className="flex gap-4">
                            <span className="flex items-center gap-1.5">
                                <span className="w-1 h-1 bg-cyan-400 rounded-full animate-pulse shadow-[0_0_5px_cyan]"></span>
                                Core: v2.0.4
                            </span>
                            <span>{time}</span>
                        </div>
                        <div>AES-256</div>
                    </div>

                    {/* Шапка (Логотип использует ваш файл logo.png из корня гитхаба) */}
                    <div className="flex justify-between items-center mb-8">
                        <div className="flex items-center gap-4">
                            <div className="relative w-14 h-14 flex items-center justify-center">
                                <div className="absolute inset-0 logo-ring rounded-full"></div>
                                <div className="relative w-11 h-11 rounded-full border-2 border-cyan-400 overflow-hidden bg-black">
                                    <img 
                                        src="logo.png" 
                                        className="w-full h-full object-cover"
                                        alt="Logo"
                                        onError={(e) => e.target.src = 'https://raw.githubusercontent.com/vselin662-ops/Selin/main/logo.png'}
                                    />
                                </div>
                            </div>
                            <div>
                                <h1 className="font-display text-3xl tracking-widest text-white glitch leading-none">SELIN</h1>
                                <div className="flex items-center gap-2 mt-1">
                                    <div className="h-[2px] w-12 bg-cyan-500 shadow-[0_0_8px_cyan]"></div>
                                    <span className="text-[8px] text-cyan-500/80 font-black tracking-[0.3em] uppercase">Genius HUD</span>
                                </div>
                            </div>
                        </div>
                        <div className="text-right">
                            <p className="text-[9px] text-gray-600 uppercase font-bold tracking-widest">Gas</p>
                            <p className="text-xl font-display text-white">{gas.toFixed(0)} <span className="text-[10px] text-cyan-500">GW</span></p>
                        </div>
                    </div>

                    {/* Анализатор */}
                    <div className="hud-border bg-cyan-500/[0.03] p-4 rounded-sm mb-6 flex items-center justify-between border-l-4 border-l-cyan-500">
                        <div className="flex items-center gap-4">
                            <i data-lucide="scan-eye" className="w-5 h-5 text-cyan-400"></i>
                            <div>
                                <p className="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Quantum Scan</p>
                                <p className="text-[11px] text-white font-mono">Status: <span className="text-cyan-400 animate-pulse">Active</span></p>
                            </div>
                        </div>
                        <div className="text-right font-display text-xl">0.02<span className="text-[10px] text-gray-600 ml-1">MS</span></div>
                    </div>

                    {/* Баланс */}
                    <div className="mb-8 p-6 bg-gradient-to-b from-white/[0.03] to-transparent border-t border-white/5 text-center">
                        <p className="text-[9px] text-gray-600 uppercase tracking-[0.4em] mb-3 font-bold">Portfolio Assets</p>
                        <div className="flex justify-center items-baseline gap-1">
                            <span className="text-3xl font-light text-cyan-500">$</span>
                            <h2 className="text-5xl font-display text-white">142,000</h2>
                        </div>
                        <div className="flex justify-center gap-3 mt-4 text-[10px] font-mono">
                            <span className="text-cyan-500 bg-cyan-500/10 px-2 py-0.5 border border-cyan-500/20">BTC: 0.042</span>
                            <span className="text-purple-500 bg-purple-500/10 px-2 py-0.5 border border-purple-500/20">TON: 840</span>
                        </div>
                    </div>

                    {/* Кнопки */}
                    <div className="grid grid-cols-2 gap-4 mb-10">
                        {[
                            { label: 'DeFi Matrix', icon: 'layers', color: 'text-cyan-400' },
                            { label: 'Stealth Bridge', icon: 'wind', color: 'text-gray-400' },
                            { label: 'Neural Stake', icon: 'zap', color: 'text-yellow-400' },
                            { label: 'Admin Terminal', icon: 'terminal', color: 'text-green-500' }
                        ].map((btn, i) => (
                            <button key={i} className="hud-border bg-white/[0.02] p-4 text-left group active:bg-cyan-500/10 border-white/5">
                                <i data-lucide={btn.icon} className={`${btn.color} w-5 h-5 mb-3 group-active:scale-95 transition-transform`}></i>
                                <p className="text-[10px] font-bold uppercase tracking-widest">{btn.label}</p>
                            </button>
                        ))}
                    </div>

                    {/* Навигация */}
                    <nav className="mt-auto flex justify-between items-center text-[10px] font-bold text-gray-600 tracking-widest uppercase py-4 border-t border-white/5">
                        <button className="text-cyan-400 border-b-2 border-cyan-400 pb-1">OVERVIEW</button>
                        <button>DECRYPT</button>
                        <button>ASSETS</button>
                        <button>NODES</button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
